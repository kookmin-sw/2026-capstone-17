spring:
  application:
    name: focus-prod

  datasource:
    url: jdbc:postgresql://${RDS_HOSTNAME}:5432/focus_avatar
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      ssl:
        enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000

jwt:
  common:
    key: ${JWT_SECRET}

kakao:
  oauth:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: http://${EC2_HOST}:8080/oauth/kakao
    authorization-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    endpoint: ${AWS_S3_ENDPOINT:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}

focus:
  metadata:
    redis:
      key-template: broadcast:{broadcast_id}:meta:{pts_us}
      ttl-seconds: 60
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://172.31.38.193:8000}
  internal-api:
    key: ${INTERNAL_API_KEY:}
  broadcast:
    output-mode: ${BROADCAST_OUTPUT_MODE:CHZZK_RTMP}
    fallback-to-hls: ${BROADCAST_FALLBACK_TO_HLS:true}

naver:
  chzzk:
    client-id: ${CHZZK_CLIENT_ID}
    client-secret: ${CHZZK_CLIENT_SECRET}
    redirect-uri: ${CHZZK_REDIRECT_URI}
    authorization-uri: ${CHZZK_AUTHORIZATION_URI:https://chzzk.naver.com/account-interlock}
    open-api-base-url: ${CHZZK_OPEN_API_BASE_URL:https://openapi.chzzk.naver.com}
    watch-url-template: ${CHZZK_WATCH_URL_TEMPLATE:https://chzzk.naver.com/{channelId}}
    publish-url-template: ${CHZZK_STREAM_PUBLISH_URL_TEMPLATE:rtmp://global-rtmp.lip2.navercorp.com:8080/relay/{streamKey}}
    oauth-state-ttl-seconds: ${CHZZK_OAUTH_STATE_TTL_SECONDS:600}
    token-refresh-buffer-seconds: ${CHZZK_TOKEN_REFRESH_BUFFER_SECONDS:60}

google:
  youtube:
    client-id: ${YOUTUBE_CLIENT_ID}
    client-secret: ${YOUTUBE_CLIENT_SECRET}
    redirect-uri: ${YOUTUBE_REDIRECT_URI:https://api.focus.ai.kr/api/v1/platforms/youtube/callback}
    authorization-uri: ${YOUTUBE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
    token-uri: ${YOUTUBE_TOKEN_URI:https://oauth2.googleapis.com/token}
    revoke-uri: ${YOUTUBE_REVOKE_URI:https://oauth2.googleapis.com/revoke}
    api-base-url: ${YOUTUBE_API_BASE_URL:https://www.googleapis.com}
    scope: ${YOUTUBE_SCOPE:https://www.googleapis.com/auth/youtube.force-ssl}
    watch-url-template: ${YOUTUBE_WATCH_URL_TEMPLATE:https://www.youtube.com/watch?v={broadcastId}}
    privacy-status: ${YOUTUBE_LIVE_PRIVACY_STATUS:public}
    latency-preference: ${YOUTUBE_LIVE_LATENCY_PREFERENCE:low}
    enable-auto-start: ${YOUTUBE_LIVE_ENABLE_AUTO_START:true}
    enable-auto-stop: ${YOUTUBE_LIVE_ENABLE_AUTO_STOP:true}
    record-from-start: ${YOUTUBE_LIVE_RECORD_FROM_START:true}
    made-for-kids: ${YOUTUBE_LIVE_MADE_FOR_KIDS:false}
    prefer-rtmps: ${YOUTUBE_PREFER_RTMPS:false}
    oauth-state-ttl-seconds: ${YOUTUBE_OAUTH_STATE_TTL_SECONDS:600}
    token-refresh-buffer-seconds: ${YOUTUBE_TOKEN_REFRESH_BUFFER_SECONDS:60}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

logging:
  level:
    org.hibernate.SQL: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
