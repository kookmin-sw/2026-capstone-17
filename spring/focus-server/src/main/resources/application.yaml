spring:
  application:
    name: focus

  datasource:
    url: jdbc:postgresql://localhost:5432/focus_avatar
    username: focus_user
    password: focus_password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        ddl-auto: update
        format_sql: true
      show-sql: true

    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  grpc:
    server:
      reflection:
        enabled: true

jwt:
  common:
    key: ${JWT_SECRET}


kakao:
  oauth:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: http://localhost:8080/oauth/kakao
    authorization-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me

focus:
  metadata:
    redis:
      key-template: broadcast:{broadcast_id}:meta:{pts_us}
      ttl-seconds: 60
  analysis:
    snapshot:
      enabled: ${FOCUS_ANALYSIS_SNAPSHOT_ENABLED:true}
      fixed-delay-ms: ${FOCUS_ANALYSIS_SNAPSHOT_DELAY_MS:60000}
      live-list-page-size: ${FOCUS_CHZZK_LIVE_PAGE_SIZE:20}
      live-list-max-pages: ${FOCUS_CHZZK_LIVE_MAX_PAGES:10}
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  internal-api:
    key: ${INTERNAL_API_KEY:}
  broadcast:
    output-mode: ${BROADCAST_OUTPUT_MODE:CHZZK_RTMP}
    fallback-to-hls: ${BROADCAST_FALLBACK_TO_HLS:true}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${AWS_S3_ENDPOINT:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}

naver:
  chzzk:
    client-id: ${CHZZK_CLIENT_ID}
    client-secret: ${CHZZK_CLIENT_SECRET}
    redirect-uri: http://localhost:8080/api/v1/platforms/chzzk/callback
    authorization-uri: https://chzzk.naver.com/account-interlock
    open-api-base-url: https://openapi.chzzk.naver.com
    watch-url-template: https://chzzk.naver.com/{channelId}
    publish-url-template: ${CHZZK_STREAM_PUBLISH_URL_TEMPLATE:rtmp://global-rtmp.lip2.navercorp.com:8080/relay/{streamKey}}
    oauth-state-ttl-seconds: 600
    token-refresh-buffer-seconds: 60

google:
  youtube:
    client-id: ${YOUTUBE_CLIENT_ID}
    client-secret: ${YOUTUBE_CLIENT_SECRET}
    redirect-uri: ${YOUTUBE_REDIRECT_URI:http://localhost:8080/api/v1/platforms/youtube/callback}
    authorization-uri: ${YOUTUBE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
    token-uri: ${YOUTUBE_TOKEN_URI:https://oauth2.googleapis.com/token}
    revoke-uri: ${YOUTUBE_REVOKE_URI:https://oauth2.googleapis.com/revoke}
    api-base-url: ${YOUTUBE_API_BASE_URL:https://www.googleapis.com}
    scope: ${YOUTUBE_SCOPE:https://www.googleapis.com/auth/youtube.force-ssl}
    watch-url-template: ${YOUTUBE_WATCH_URL_TEMPLATE:https://www.youtube.com/watch?v={broadcastId}}
    privacy-status: ${YOUTUBE_LIVE_PRIVACY_STATUS:public}
    latency-preference: ${YOUTUBE_LIVE_LATENCY_PREFERENCE:low}
    enable-auto-start: ${YOUTUBE_LIVE_ENABLE_AUTO_START:true}
    enable-auto-stop: ${YOUTUBE_LIVE_ENABLE_AUTO_STOP:true}
    record-from-start: ${YOUTUBE_LIVE_RECORD_FROM_START:true}
    made-for-kids: ${YOUTUBE_LIVE_MADE_FOR_KIDS:false}
    prefer-rtmps: ${YOUTUBE_PREFER_RTMPS:false}
    oauth-state-ttl-seconds: ${YOUTUBE_OAUTH_STATE_TTL_SECONDS:600}
    token-refresh-buffer-seconds: ${YOUTUBE_TOKEN_REFRESH_BUFFER_SECONDS:60}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
