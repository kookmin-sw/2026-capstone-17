name: Deploy FastAPI to EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            INSTALL_MEDIA_DEPS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/focus-fast-api:latest
            ${{ secrets.DOCKER_USERNAME }}/focus-fast-api:${{ github.sha }}

      - name: Copy deploy compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.ec2.yaml"
          target: "~/focus-fast-api"
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/focus-fast-api
            cd ~/focus-fast-api

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cat > .env <<EOF
            FULL_IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/focus-fast-api:${{ github.sha }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            HLS_PUBLIC_BASE_URL=${{ secrets.HLS_PUBLIC_BASE_URL }}
            EOF

            docker pull ${{ secrets.DOCKER_USERNAME }}/focus-fast-api:${{ github.sha }}
            docker compose -f docker-compose.ec2.yaml down || true
            docker compose -f docker-compose.ec2.yaml up -d
            docker image prune -f
