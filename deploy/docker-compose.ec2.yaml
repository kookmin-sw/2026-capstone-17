services:
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: focus-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8890:8890/udp"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro

  fastapi:
    image: ${FULL_IMAGE_NAME}
    container_name: focus-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: ${REDIS_URL}
      REDIS_METADATA_KEY_TEMPLATE: broadcast:{broadcast_id}:meta:{pts_us}
      REDIS_METADATA_LATEST_KEY_TEMPLATE: broadcast:{broadcast_id}:meta:latest
      REDIS_METADATA_INDEX_KEY_TEMPLATE: broadcast:{broadcast_id}:meta:index
      MEDIAMTX_RTSP_READ_BASE_URL: rtsp://mediamtx:8554
      MEDIAMTX_PATH_PREFIX: live
      HLS_OUTPUT_ROOT: /data/hls
      HLS_PUBLIC_BASE_URL: ${HLS_PUBLIC_BASE_URL}
      DEFAULT_OUTPUT_MODE: ${DEFAULT_OUTPUT_MODE:-HLS}
      PIPELINE_FPS: ${PIPELINE_FPS:-15}
      MAX_FRAME_LAG_MS: ${MAX_FRAME_LAG_MS:-100}
      FFMPEG_LOG_LEVEL: ${FFMPEG_LOG_LEVEL:-warning}
      PIPELINE_GOP_SECONDS: ${PIPELINE_GOP_SECONDS:-1}
      PIPELINE_VIDEO_BITRATE: ${PIPELINE_VIDEO_BITRATE:-1000k}
      PIPELINE_MAXRATE: ${PIPELINE_MAXRATE:-1000k}
      PIPELINE_BUFSIZE: ${PIPELINE_BUFSIZE:-2000k}
      PIPELINE_MAX_FRAME_WIDTH: ${PIPELINE_MAX_FRAME_WIDTH:-720}
      PIPELINE_MAX_FRAME_HEIGHT: ${PIPELINE_MAX_FRAME_HEIGHT:-720}
      PIPELINE_X264_PRESET: ${PIPELINE_X264_PRESET:-ultrafast}
      PIPELINE_X264_PROFILE: ${PIPELINE_X264_PROFILE:-high}
      HLS_TIME: ${HLS_TIME:-1}
      HLS_LIST_SIZE: ${HLS_LIST_SIZE:-6}
      HLS_FLAGS: ${HLS_FLAGS:-delete_segments+independent_segments+append_list+omit_endlist}
      INPUT_OPEN_RETRY_COUNT: ${INPUT_OPEN_RETRY_COUNT:-5}
      INPUT_OPEN_RETRY_BACKOFF_MS: ${INPUT_OPEN_RETRY_BACKOFF_MS:-1000}
      OUTPUT_AUDIO_BITRATE: ${OUTPUT_AUDIO_BITRATE:-128k}
      OUTPUT_AUDIO_SAMPLE_RATE: ${OUTPUT_AUDIO_SAMPLE_RATE:-48000}
      OUTPUT_AUDIO_CHANNELS: ${OUTPUT_AUDIO_CHANNELS:-2}
      AVATAR_MAX_FACES_PER_FRAME: ${AVATAR_MAX_FACES_PER_FRAME:-3}
      AVATAR_METADATA_GRACE_MS: ${AVATAR_METADATA_GRACE_MS:-100}
      AVATAR_PRIMARY_RESELECT_GRACE_MS: ${AVATAR_PRIMARY_RESELECT_GRACE_MS:-250}
      AVATAR_PERSON_SLOT_GRACE_MS: ${AVATAR_PERSON_SLOT_GRACE_MS:-3000}
      AVATAR_PERSON_SLOT_MATCH_IOU: ${AVATAR_PERSON_SLOT_MATCH_IOU:-0.10}
      AVATAR_MOSAIC_NON_SELECTED_FACES: ${AVATAR_MOSAIC_NON_SELECTED_FACES:-false}
      METADATA_POLL_ATTEMPTS: ${METADATA_POLL_ATTEMPTS:-2}
      METADATA_POLL_INTERVAL_MS: ${METADATA_POLL_INTERVAL_MS:-10}
      METADATA_LOOKUP_TOLERANCE_US: ${METADATA_LOOKUP_TOLERANCE_US:-150000}
      METADATA_LATEST_TOLERANCE_US: ${METADATA_LATEST_TOLERANCE_US:-3000000}
      METADATA_LOOKUP_FINE_TOLERANCE_US: ${METADATA_LOOKUP_FINE_TOLERANCE_US:-200}
      METADATA_LOOKUP_COARSE_STEP_US: ${METADATA_LOOKUP_COARSE_STEP_US:-500}
      METADATA_AUTO_OFFSET_MAX_US: ${METADATA_AUTO_OFFSET_MAX_US:-8000000}
      METADATA_INDEX_LOOKUP_WINDOW_US: ${METADATA_INDEX_LOOKUP_WINDOW_US:-200000}
      METADATA_LATEST_FALLBACK_WINDOW_US: ${METADATA_LATEST_FALLBACK_WINDOW_US:-200000}
      ANALYSIS_ENABLED: ${ANALYSIS_ENABLED:-false}
      ANALYSIS_OUTPUT_FILENAME: ${ANALYSIS_OUTPUT_FILENAME:-analysis.mp4}
      ANALYSIS_RETRY_ATTEMPTS: ${ANALYSIS_RETRY_ATTEMPTS:-3}
      ANALYSIS_RETRY_BACKOFF_SEC: ${ANALYSIS_RETRY_BACKOFF_SEC:-2}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      GEMINI_UPLOAD_ATTEMPTS: ${GEMINI_UPLOAD_ATTEMPTS:-3}
      GEMINI_UPLOAD_BACKOFF_INITIAL_SEC: ${GEMINI_UPLOAD_BACKOFF_INITIAL_SEC:-2}
      GEMINI_UPLOAD_BACKOFF_MAX_SEC: ${GEMINI_UPLOAD_BACKOFF_MAX_SEC:-10}
      GEMINI_FILE_POLL_INTERVAL_SEC: ${GEMINI_FILE_POLL_INTERVAL_SEC:-5}
      GEMINI_FILE_POLL_TIMEOUT_SEC: ${GEMINI_FILE_POLL_TIMEOUT_SEC:-120}
      GEMINI_GENERATE_ATTEMPTS: ${GEMINI_GENERATE_ATTEMPTS:-4}
      GEMINI_GENERATE_BACKOFF_INITIAL_SEC: ${GEMINI_GENERATE_BACKOFF_INITIAL_SEC:-5}
      GEMINI_GENERATE_BACKOFF_MAX_SEC: ${GEMINI_GENERATE_BACKOFF_MAX_SEC:-20}
      SPRING_INTERNAL_BASE_URL: ${SPRING_INTERNAL_BASE_URL:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      LOG_LEVEL: INFO
    depends_on:
      - mediamtx
    volumes:
      - hls_data:/data/hls
      - avatar_cache:/tmp/focus-avatar-cache

volumes:
  hls_data:
  avatar_cache:
