services:
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: focus-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8890:8890/udp"
      - "8189:8189/udp"

  fastapi:
    image: ${FULL_IMAGE_NAME}
    container_name: focus-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: ${REDIS_URL}
      REDIS_METADATA_KEY_TEMPLATE: broadcast:{broadcast_id}:meta:{pts_us}
      MEDIAMTX_RTSP_READ_BASE_URL: rtsp://mediamtx:8554
      MEDIAMTX_PATH_PREFIX: live
      HLS_OUTPUT_ROOT: /data/hls
      HLS_PUBLIC_BASE_URL: ${HLS_PUBLIC_BASE_URL}
      PIPELINE_FPS: 30
      MAX_FRAME_LAG_MS: 250
      FFMPEG_LOG_LEVEL: ${FFMPEG_LOG_LEVEL:-warning}
      PIPELINE_GOP_SECONDS: ${PIPELINE_GOP_SECONDS:-1}
      PIPELINE_VIDEO_BITRATE: ${PIPELINE_VIDEO_BITRATE:-2500k}
      PIPELINE_MAXRATE: ${PIPELINE_MAXRATE:-2500k}
      PIPELINE_BUFSIZE: ${PIPELINE_BUFSIZE:-5000k}
      HLS_TIME: ${HLS_TIME:-1}
      HLS_LIST_SIZE: ${HLS_LIST_SIZE:-6}
      HLS_FLAGS: ${HLS_FLAGS:-delete_segments+independent_segments+append_list+omit_endlist}
      ANALYSIS_ENABLED: ${ANALYSIS_ENABLED:-false}
      ANALYSIS_OUTPUT_FILENAME: ${ANALYSIS_OUTPUT_FILENAME:-analysis.mp4}
      ANALYSIS_RETRY_ATTEMPTS: ${ANALYSIS_RETRY_ATTEMPTS:-3}
      ANALYSIS_RETRY_BACKOFF_SEC: ${ANALYSIS_RETRY_BACKOFF_SEC:-2}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SPRING_INTERNAL_BASE_URL: ${SPRING_INTERNAL_BASE_URL:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      LOG_LEVEL: INFO
    depends_on:
      - mediamtx
    volumes:
      - hls_data:/data/hls

volumes:
  hls_data:
