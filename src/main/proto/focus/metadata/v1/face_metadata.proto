syntax = "proto3";

package focus.metadata.v1;

option java_multiple_files = true;
option java_outer_classname = "FaceMetadataProto";
option java_package = "com.capstone.focus.grpc.metadata.v1";

service FaceMetadataIngestService {
  rpc PushFaceMetadata(stream PushFaceMetadataRequest) returns (PushFaceMetadataResponse);
}

message PushFaceMetadataRequest {
  // Broadcast/session identifier created by Spring.
  string session_id = 1;

  // Media PTS in microseconds.
  int64 pts_us = 2;

  // Avatar resource currently used by the client.
  string avatar_url = 3;

  // Face controls such as pitch/yaw/roll, eyeBlink, jawOpen and AU values.
  map<string, float> face_data = 4;

  // Optional fields for tracking consistency and debug.
  string tracking_id = 5;
  bool is_reentry = 6;
  float confidence = 7;
  repeated float bbox = 8;
  repeated Landmark landmarks = 9;
}

message Landmark {
  float x = 1;
  float y = 2;
  float z = 3;
}

message PushFaceMetadataResponse {
  string session_id = 1;
  int64 received_frames = 2;
  int64 accepted_frames = 3;
  int64 dropped_frames = 4;
  int64 last_pts_us = 5;
}
