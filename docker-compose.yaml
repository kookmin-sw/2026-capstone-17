version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: focus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - focus-network

  app:
    image: ${FULL_IMAGE_NAME}
    container_name: focus-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RDS_HOSTNAME=${RDS_HOSTNAME}
      - RDS_USERNAME=${RDS_USERNAME}
      - RDS_PASSWORD=${RDS_PASSWORD}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - EC2_HOST=${EC2_HOST}
      - FASTAPI_BASE_URL=${FASTAPI_BASE_URL}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - focus-network

networks:
  focus-network:
    driver: bridge

volumes:
  redis_data:
