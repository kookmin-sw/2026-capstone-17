version: '3.8'

services:
  postgres:
#    env_file:
#      - .env
    image: postgres:16-alpine
    container_name: focus-postgres
    environment:
      POSTGRES_DB: focus_avatar
      POSTGRES_USER: focus_user
      POSTGRES_PASSWORD: focus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: focus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: